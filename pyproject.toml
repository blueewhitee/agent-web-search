[project]
name = "nature-based-se"
version = "0.1.0"
description = "Self-hosted LLM-optimized Search API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic-settings>=2.0",
    "trafilatura>=2.1",
    "readability-lxml>=0.8",
    "fastembed>=0.7",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
